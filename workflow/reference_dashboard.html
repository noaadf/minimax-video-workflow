<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全片逐镜头研究</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1118;color:#eef4f7;font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{padding:24px 32px;border-bottom:1px solid #2a3947}h1{font-size:26px;margin:4px 0}a{color:#f7d16b}button,select,input{font:inherit;background:#172734;color:#eef4f7;border:1px solid #3a4d5d;border-radius:7px;padding:8px}button{cursor:pointer}main{padding:24px 32px;display:grid;grid-template-columns:410px 1fr;gap:28px}.left{position:sticky;top:20px;align-self:start}video{width:100%;max-height:300px;background:#000;margin-top:18px}#nav{display:flex;gap:6px;flex-wrap:wrap}.active{border-color:#f7d16b;color:#f7d16b}.muted{color:#91a8b8}.metric{display:flex;gap:25px;margin:15px 0}.metric strong{display:block;font-size:25px;color:#f7d16b}article{border:1px solid #293b49;background:#121e29;border-radius:10px;padding:18px;margin:0 0 14px}article h3{margin:0 0 8px;font-size:16px}.row{display:flex;justify-content:space-between;gap:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}.field b{display:block;color:#9cb8c9;font-size:11px;letter-spacing:1px}.play{color:#f7d16b}.note{background:#263527;color:#a8d6b7;padding:12px;border-radius:8px}#summary{font-size:13px;max-height:400px;overflow:auto}#search{width:100%;margin-bottom:16px}.tag{font-size:11px;color:#92a7b6}.bar{height:5px;background:#26394a}.bar i{display:block;height:100%;background:#f7d16b}@media(max-width:850px){main{display:block;padding:16px}.left{position:static;margin-bottom:24px}.grid{grid-template-columns:1fr}}</style>
<header><a href="http://127.0.0.1:8768">← 产出看板</a><h1>全片逐镜头研究</h1><div class="muted">画面 × 解说 × 剪辑 × 声音证据 × 可复用方法</div></header>
<main><aside class="left"><div id="nav"></div><h2 id="title"></h2><div id="progress" class="muted">准备证据中</div><div class="bar"><i id="bar"></i></div><div class="metric"><div><strong id="shots">0</strong>镜头分析段</div><div><strong id="coverage">0%</strong>时间轴覆盖</div><div><strong id="duration">—</strong>原片长度</div></div><video id="player" controls playsinline preload="metadata"></video><p><a id="source" target="_blank" rel="noreferrer">打开原片与出处 ↗</a></p><div class="note">全时间轴抽帧及模型辅助镜头研究。边界可能有误差；声音标签是算法推测，不能当作曲目或人工听感鉴定。</div><details open><summary>全片结构与可复用规则</summary><p id="downloads"></p><div id="summary">全片镜头分析完成后汇总。</div></details></aside>
<section><input id="search" placeholder="筛选镜头：地图、设问、特写、转折……"><div id="list"></div></section></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tc=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+'.'+Math.floor(t*10%10);const confidenceLabel={high:'高把握',medium:'中等把握',low:'待复核'},boundaryLabel={detector_frame:'检测切点',sampled_approx:'近似切点',batch_edge:'分析段边界'};let data,selected=location.hash.slice(1),source;
function render(){const v=data.videos.find(v=>v.id===selected)||data.videos[0];if(!v)return;selected=v.id;$('nav').innerHTML=data.videos.map(x=>`<button data-video="${x.id}" class="${x.id===selected?'active':''}">${esc(x.creator)}</button>`).join('');$('title').textContent=v.title;$('shots').textContent=v.shots.length;$('coverage').textContent=Math.min(100,Math.round(v.reviewed_seconds/v.duration_seconds*100))+'%';$('duration').textContent=tc(v.duration_seconds);$('progress').textContent=`已分析 ${v.reviewed_batches} / ${v.total_batches??'…'} 批证据`;$('bar').style.width=Math.min(100,v.reviewed_seconds/v.duration_seconds*100)+'%';$('source').href=v.source_url;$('downloads').innerHTML=Object.entries(v.downloads||{}).map(([ext,url])=>`<a href="${esc(url)}" download>下载逐镜头表 ${ext.toUpperCase()}</a>`).join(' · ');if(source!==v.video_url){source=v.video_url;$('player').src=source}$('summary').innerHTML=v.summary?`<p>${esc(v.summary.overall_arc)}</p><h4>章节</h4>${(v.summary.chapters||[]).map(c=>`<p><button class="play" data-time="${c.start}">${tc(c.start)}</button> ${esc(c.name)}：${esc(c.function)}</p>`).join('')}<h4>可复用规则</h4>${(v.summary.reusable_rules||[]).map(r=>`<p><b>${esc(r.rule)}</b><br>${esc(r.evidence)}<br><span class="muted">${esc(r.adaptation)}</span></p>`).join('')}<h4>解说与声音</h4><p>${esc(v.summary.narration?.structure)}</p><p>${esc(v.summary.narration?.density_changes)}</p><p>${esc(v.summary.sound?.measured_patterns)}</p><p class="muted">${esc(v.summary.sound?.production_adaptation)}</p><h4>互动入口：观察与创作假设</h4>${(v.summary.engagement?.observed||[]).map(x=>`<p>${tc(x.start)}–${tc(x.end)} ${esc(x.device)}</p>`).join('')}${(v.summary.engagement?.adaptation_hypotheses||[]).map(x=>`<p class="muted">原创迁移：${esc(x)}</p>`).join('')}<h4>30 秒原创样板</h4>${(v.summary.thirty_second_blueprints||[]).map(x=>`<details><summary>${esc(x.name)}</summary>${x.beats.map(b=>`<p><b>${b.start}–${b.end}秒 · ${esc(b.purpose)}</b><br>${esc(b.visual)}<br>解说：${esc(b.narration_move)}<br>声音：${esc(b.sound_move)}</p>`).join('')}<p>${esc(x.comment_invitation_pattern)}</p></details>`).join('')}`:'全片镜头分析完成后汇总。';const q=$('search').value.toLowerCase();$('list').innerHTML=v.shots.filter(s=>!q||JSON.stringify(s).toLowerCase().includes(q)).map(s=>`<article><div class="row"><h3><button class="play" data-time="${s.start}" data-end="${s.end}">${tc(s.start)}–${tc(s.end)}</button> ${s.id}</h3><span class="tag">${(s.end-s.start).toFixed(1)}秒 · ${esc(confidenceLabel[s.confidence]||s.confidence)} · ${esc(boundaryLabel[s.boundary_precision]||s.boundary_precision)}</span></div><p>${esc(s.visual)}</p><div class="grid">${[['景别与运动',s.scale+'；'+s.motion],['剪辑进入',s.cut_in],['解说概述',s.narration_summary],['叙事作用',s.rhetorical_role],['声音关系',s.av_relation],['注意力/参与入口',s.engagement_device],['可复用方法',s.reusable_move]].map(([k,v])=>`<div class="field"><b>${k}</b>${esc(v)}</div>`).join('')}</div><p class="tag">${(s.evidence_urls||[]).map((u,i)=>`<a href="${esc(u)}" target="_blank">抽帧证据 ${i+1}</a>`).join(" · ")}</p></article>`).join('')||'<p class="muted">该片正在准备全片证据；完成的镜头分析会自动出现。</p>'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.video){selected=b.dataset.video;history.replaceState(null,"", "#"+selected);render()}if(b.dataset.time){const p=$('player');p.currentTime=Number(b.dataset.time);p.play();p.dataset.stopAt=b.dataset.end||''}});$('player').addEventListener('timeupdate',()=>{const p=$('player');if(p.dataset.stopAt&&p.currentTime>=Number(p.dataset.stopAt)){p.pause();p.dataset.stopAt=''}});$('search').addEventListener('input',render);window.addEventListener('hashchange',()=>{selected=location.hash.slice(1);if(data)render()});async function refresh(){try{const next=await(await fetch('/api/study')).json();const changed=!data||JSON.stringify(next.videos)!==JSON.stringify(data.videos);data=next;if(changed)render()}catch(e){}}refresh();setInterval(refresh,10000);
</script></html>
