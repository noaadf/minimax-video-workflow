<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频作品 · 生产看板</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c141e;color:#eef4fb;font:15px/1.6 -apple-system,"PingFang SC",sans-serif}header,main{max-width:1450px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:28px}p{color:#aebed0;margin:6px 0}a{color:#efce7e}nav{display:flex;gap:20px}.summary{display:flex;gap:24px;margin:0 0 24px;color:#efce7e}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:#152231;border:1px solid #304154;border-radius:16px;padding:20px;min-width:0}.card h2{font-size:19px;min-height:60px;margin:12px 0}.badge{color:#9de1bf;background:#203e39;border-radius:20px;padding:4px 12px;font-size:13px}.identity{font-size:12px;color:#96aabe}.preview{display:block;width:100%;height:330px;background:#070c12;border-radius:10px}.controls{padding:4px 0}.delivery-actions button{flex:1;font-weight:700;min-height:46px!important}.delivery-actions button:last-child{background:#edc56b!important;color:#17202a!important}.note{font-size:13px;white-space:pre-wrap;border-left:2px solid #edc56b;padding:7px 12px;margin:10px 0}details{margin-top:14px;border-top:1px solid #354459;padding-top:12px}summary{cursor:pointer;color:#b9cadd}.version{padding:9px 0;border-bottom:1px solid #26374a;font-size:13px}.version small{display:block;overflow-wrap:anywhere;color:#8599af}.hint{font-size:12px;color:#9aaebf}.empty{padding:80px 20px;text-align:center}#connection{font-size:12px;color:#9bb5cd}button{cursor:pointer}label{cursor:pointer}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.grid{grid-template-columns:1fr}header{display:block}.preview{height:360px}nav{margin-top:12px}}
</style>
<header><div><h1>视频作品</h1><p>迭代中 → 已完成迭代，待你审批 → 已审批定稿。</p></div><nav><a href="/pipeline">剧情与分镜</a><a href="/tasks">后台任务明细</a><a href="/styles">声音样板库</a></nav></header>
<main><div class="summary"><span id="count"></span><span id="pending"></span><span id="approvedCount"></span><span id="backlog"></span><span id="connection">正在读取…</span></div><p style="margin-bottom:20px"><label><input type="checkbox" id="history"> 显示早期测试作品</label></p><div class="grid" id="products"></div></main>
<script src="/actions.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state=[],fingerprints={};const labels={queued:'排队中',running:'处理中',completed:'已完成',attention:'需处理',pending:'待处理',succeeded:'已完成',failed:'失败',review_required:'待查看'};
function render(){const rows=state.filter(p=>p.pilot||p.production||document.querySelector('#history').checked);document.querySelector('#count').textContent=rows.length+' 条作品';document.querySelector('#pending').textContent=rows.reduce((a,p)=>a+p.requests.filter(r=>r.status==='pending').length,0)+' 条返修待处理';document.querySelector('#approvedCount').textContent=rows.filter(p=>p.can_approve).length+' 条待审批 · '+rows.filter(p=>p.approved).length+' 条已定稿';const host=document.querySelector('#products');for(const el of [...host.children])if(!rows.some(p=>p.id===el.dataset.product)){delete fingerprints[el.dataset.product];el.remove()}
for(const p of rows){let card=[...host.children].find(e=>e.dataset.product===p.id);const hash=JSON.stringify(p);if(card&&fingerprints[p.id]===hash)continue;if(!card){card=document.createElement('article');card.className='card';card.dataset.product=p.id;host.append(card)}fingerprints[p.id]=hash;const current=p.current;card.innerHTML=`<span class="badge">${esc(p.status)}</span><h2>${esc(p.title)}</h2><p class="hint">${esc(p.status_reason)}</p><div class="identity">作品编号 · ${esc(p.id)}</div>${current?`<video class="preview" controls preload="metadata" src="${esc(current.video_url)}"></video><div class="controls" data-delivery-job="${esc(current.id)}"></div><p class="hint">${p.approved?'已锁定定稿':'当前完整成片'} · 版本 ${esc(current.video_sha256.slice(0,8))}。导出包含完整视频和封面。</p>`:'<div class="empty">正在准备成片</div>'}<div>${p.requests.map(r=>`<div class="note"><b>返修 · ${esc(labels[r.status]||r.status)}</b>${r.time_seconds!=null?' · '+esc(r.time_seconds)+'秒':''}<br>${esc(r.note)}<div class="hint">针对版本 ${esc(r.video_sha256.slice(0,8))}</div></div>`).join('')}</div><details><summary>版本与处理记录 · ${p.versions.length} 条${p.active_count?' · '+p.active_count+' 条处理中':''}</summary>${[...p.versions].reverse().map((v,i)=>`<div class="version">${v.current?'当前成片':v.video_url?'历史成片':'处理任务'} · ${esc(labels[v.status]||v.status)} ${v.video_url?`<a href="${esc(v.video_url)}" target="_blank">观看</a>`:''}<small>${esc(v.id)}</small></div>`).join('')}</details>`;if(current){window.mountDeliveryActions(card.querySelector('.controls'),current.id);if(p.approved){const repair=card.querySelector('.delivery-actions button:last-child');repair.disabled=true;repair.textContent='已定稿 · 返修已停止'}else{const approve=document.createElement('button');approve.textContent=p.can_approve?'审批通过，锁定成片':'处理完成后可审批';approve.disabled=!p.can_approve;approve.style='width:100%;padding:12px;margin-top:8px;border-radius:8px;background:#9de1bf;color:#132a20;border:0;font-weight:bold';approve.onclick=async()=>{if(!confirm('审批当前完整成片，并停止这条视频的后续自动迭代？'))return;approve.disabled=true;try{const q=new URLSearchParams(location.search).get('review_token');if(q)sessionStorage.setItem('review_token',q);const token=sessionStorage.getItem('review_token')||(await(await fetch('/api/delivery-actions')).json()).token;const response=await fetch('/api/approve-product',{method:'POST',headers:{'Content-Type':'application/json','X-Workflow-Token':token},body:JSON.stringify({job_id:current.id,video_sha256:current.video_sha256})});const result=await response.json();if(!response.ok)throw Error(result.error);await update()}catch(e){alert(e.message);approve.disabled=false}};card.querySelector('.controls').append(approve)}}} }
document.querySelector('#history').onchange=render;
async function update(){try{const r=await fetch('/api/products',{cache:'no-store'});if(!r.ok)throw Error();const payload=await r.json();state=payload.products;document.querySelector('#backlog').textContent=(payload.editorial_backlog?.awaiting_source_evidence||0)+' 个选题待核验（尚未生成）';render();document.querySelector('#connection').textContent='已更新 '+new Date().toLocaleTimeString()}catch(e){document.querySelector('#connection').textContent='连接中断，保留现有内容'}}async function refresh(){await update();setTimeout(refresh,10000)}refresh();
</script></html>
