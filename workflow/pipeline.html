<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>剧情管线 · 视频作品</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c141e;color:#eef4fb;font:15px/1.6 -apple-system,"PingFang SC",sans-serif}header,main{max-width:1150px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:28px}a{color:#efce7e}p{color:#aebed0}.panel{background:#152231;border:1px solid #304154;border-radius:16px;padding:24px;margin-bottom:22px}.status{display:inline-block;border-radius:20px;padding:4px 12px;background:#203e39;color:#9de1bf}.flow{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.flow span{border:1px solid #40556c;border-radius:8px;padding:8px 12px}.flow i{align-self:center;color:#7188a0;font-style:normal}.frames{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.frames img{width:100%;aspect-ratio:9/16;object-fit:contain;background:#070c12;border-radius:10px}.frames a{text-decoration:none}figure{margin:0}figcaption{font-size:12px;color:#aebed0;margin-top:6px}video{width:100%;max-height:650px;background:#070c12;border-radius:12px}.hint{font-size:13px}.hidden{display:none}@media(max-width:700px){header{display:block}.frames{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<header><div><h1>剧情与分镜</h1><p>先看完整故事，再检查场景、行动与结果的承接。</p></div><a href="/">返回视频作品</a></header>
<main><section class="panel"><span class="status" id="status">正在读取…</span><div class="flow"><span>剧情设计</span><i>→</i><span>首尾分镜</span><i>→</i><span>真实声音粗剪</span><i>→</i><span>动作镜头生成</span><i>→</i><span>完整成片检查</span></div><p id="next"></p><p class="hint" id="notes"></p><p class="hint" id="connection"></p></section>
<section class="panel hidden" id="previewPanel"><h2 id="previewTitle">分镜粗剪</h2><video id="preview" controls preload="metadata"></video><p class="hint">粗剪用于核对事件、构图和节奏；动作结果与连续性还需逐镜检查，完整观看后才能验收。</p></section>
<section class="panel"><h2>首尾关键帧 <small id="frameCount"></small></h2><p>仅展示当前片绑定的首尾关键帧。每组首尾属于同一镜头，不能作为两个独立场景；没有绑定素材时不展示其他产品的图片。</p><div class="frames" id="frames"></div></section></main>
<script>
let currentPreview='',frameKey='';const $=id=>document.getElementById(id);
async function refresh(){try{const response=await fetch('/api/pipeline',{cache:'no-store'});if(!response.ok)throw Error('offline');const data=await response.json();$('status').textContent=data.label;$('next').textContent=data.next_step;$('notes').textContent=(data.notes||[]).join(' · ');$('frameCount').textContent='('+data.keyframes_count+'张)';$('connection').textContent='已更新 '+new Date(data.at*1000).toLocaleTimeString();if(data.preview_url){$('previewPanel').classList.remove('hidden');$('previewTitle').textContent=data.preview_kind;if(currentPreview!==data.preview_url){$('preview').src=data.preview_url;currentPreview=data.preview_url}}const key=JSON.stringify(data.keyframes);if(key!==frameKey){$('frames').replaceChildren();for(const row of data.keyframes){const figure=document.createElement('figure'),a=document.createElement('a'),img=document.createElement('img'),caption=document.createElement('figcaption');a.href=row.url;a.target='_blank';img.src=row.url;img.alt=row.name;img.loading='lazy';caption.textContent=row.name.replace('_start',' · 起始').replace('_end',' · 结束');a.append(img);figure.append(a,caption);$('frames').append(figure)}frameKey=key}}catch(e){$('connection').textContent='连接中断，保留现有内容'}finally{setTimeout(refresh,10000)}}refresh();
</script></body></html>
