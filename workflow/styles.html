<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>声音与解说样板库</title><style>
:root{color-scheme:dark}body{background:#0b1118;color:#edf3f7;font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;margin:0;padding:30px;max-width:1400px;margin:auto}a{color:#f7d16b}h1{font-size:28px;margin-bottom:6px}.sub,small{color:#9bb0bf}main{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:28px}article{background:#121d28;border:1px solid #293b4a;border-radius:14px;padding:22px}h2{margin:0 0 4px}audio{width:100%;margin:16px 0}video{width:100%;max-height:520px;background:#000;border-radius:8px;margin-top:18px}p{margin:8px 0}.tag{display:inline-block;background:#273c42;color:#85dcc1;padding:3px 10px;border-radius:6px;font-size:12px}footer{margin-top:24px;font-size:13px;color:#9bb0bf}@media(max-width:800px){main{grid-template-columns:1fr}body{padding:18px}}</style>
<a href="/">← 产出看板</a><h1>声音与解说样板库</h1><p class="sub">同一主题、同一批生成画面，比较三种叙述方式。先听声音，再看完整效果。</p><main id="cards"><p>样板正在生成，完成后自动显示。</p></main><footer>参考研究范围：四部公开视频各前 60 秒，包含抽帧、自动转写与混合音轨强弱测量。声音和配乐为新组合，评论转化效果待测。对照片复用首版画面；已知画面重复和结构连续性问题正在另行修复。</footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let signature='';
async function refresh(){try{const r=await fetch('/api/styles');const data=await r.json();const next=JSON.stringify(data);if(next===signature)return;signature=next;if(!data.items.length)return;const cards=document.getElementById('cards');if(cards.querySelector('p')&&!cards.querySelector('article'))cards.innerHTML='';for(const x of data.items){let card=document.getElementById(x.id);if(!card){card=document.createElement('article');card.id=x.id;card.innerHTML=`<span class="tag">原创结构改编</span><h2>${esc(x.label)}</h2><small>${esc(x.voice_label||x.voice)} · ${esc(x.music)}</small><audio controls preload="metadata" src="${esc(x.audio_url)}"></audio><p><a href="${esc(x.reference_url)}" target="_blank" rel="noreferrer">参考片与出处 ↗</a> · <a href="${esc(x.publication_url)}">文案与配乐署名</a></p><p class="sub">${esc(x.evidence_scope)}</p><details><summary>解说与评论引导</summary><p>${(x.narration||[]).map(esc).join("<br>")}</p><p>${esc(x.comment_prompt)}</p></details>`;cards.appendChild(card)}if(x.video_url&&!card.querySelector('video')){const v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='metadata';v.src=x.video_url;card.appendChild(v)}}}catch(e){}}refresh();setInterval(refresh,5000);
</script></html>
